<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coffee Run</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #000000;
    --grid: #d8d8d8;
    --dim: #6b6b6b;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--fg);
    height: 100%;
    overflow: hidden;
    font-family: 'Courier New', ui-monospace, monospace;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  #wrap {
    position: relative;
    width: 100%;
    max-width: 1120px;
    padding: 16px;
  }

  #hud {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 14px;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 8px;
    color: var(--fg);
  }

  #hud .label { color: var(--dim); }

  canvas {
    display: block;
    width: 100%;
    background: var(--bg);
    border: 2px solid var(--fg);
    image-rendering: pixelated;
  }

  #overlay {
    position: absolute;
    inset: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    background: rgba(255,255,255,0.92);
    border: 2px solid var(--fg);
    padding: 24px;
  }

  #overlay.hidden { display: none; }

  #overlay h1 {
    font-size: 22px;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin: 0 0 12px;
  }

  #overlay p {
    font-size: 13px;
    color: var(--dim);
    line-height: 1.6;
    margin: 4px 0;
    max-width: 420px;
  }

  #overlay .key {
    display: inline-block;
    border: 1px solid var(--fg);
    padding: 1px 6px;
    margin: 0 2px;
    font-size: 12px;
  }

  #overlay button {
    margin-top: 18px;
    background: var(--fg);
    color: var(--bg);
    border: none;
    padding: 10px 24px;
    font-family: inherit;
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
  }

  #overlay button:hover { opacity: 0.8; }

  #touch-controls {
    display: none;
    justify-content: center;
    gap: 12px;
    margin-top: 10px;
  }

  #touch-controls button {
    flex: 1;
    max-width: 220px;
    background: transparent;
    color: var(--fg);
    border: 2px solid var(--fg);
    padding: 14px;
    font-family: inherit;
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  #touch-controls button:active { background: var(--fg); color: var(--bg); }

  @media (hover: none) and (pointer: coarse) {
    #touch-controls { display: flex; }
  }

  a#back {
    position: absolute;
    top: 16px;
    left: 16px;
    color: var(--dim);
    font-size: 12px;
    text-decoration: none;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  a#back:hover { color: var(--fg); }
</style>
</head>
<body>

<a id="back" href="index.html">&larr; Dashboard</a>

<div id="wrap">
  <div id="hud">
    <span><span class="label">Score</span> <span id="score">0</span></span>
    <span><span class="label">Best</span> <span id="best">0</span></span>
  </div>

  <div style="position:relative;">
    <canvas id="game" width="1080" height="360"></canvas>

    <div id="overlay">
      <h1>Coffee Run</h1>
      <p><span class="key">Space</span> / <span class="key">&uarr;</span> jump &mdash; over hazards, or up to grab coffee (+5)</p>
      <p><span class="key">&darr;</span> / <span class="key">K</span> kick &mdash; books &amp; clovers give +100</p>
      <p style="color: var(--fg);">Some books &amp; clovers float up high &mdash; jump AND kick them in midair. Plain hazards can't be kicked, only jumped.</p>
      <button id="start-btn">Start</button>
    </div>
  </div>

  <div id="touch-controls">
    <button id="touch-jump">Jump</button>
    <button id="touch-kick">Kick</button>
  </div>
</div>

  // Source art here faces left; the runner travels right (toward
  // obstacles entering from the right edge), so player sprites are
  // mirrored at draw time. Set to false if you upload right-facing art.
  const MIRROR_PLAYER_SPRITES = true;

  const loadedImages = {};
  let pendingLoads = 0;
  Object.entries(IMAGES).forEach(([key, src]) => {
    if (!src) return;
    pendingLoads++;
    const img = new Image();
    img.onload = () => { loadedImages[key] = img; pendingLoads--; };
    img.onerror = () => { pendingLoads--; };
    img.src = src;
  });

  // ---------------------------------------------------------------
  // CANVAS / CONSTANTS
  // ---------------------------------------------------------------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;
  const GROUND_Y = H - 40;

  const GRAVITY = 0.7;
  const JUMP_VELOCITY = -12.5;
  const KICK_DURATION = 260; // ms
  const KICK_RANGE = 78;     // px in front of player

  let speed = 6.2;
  const SPEED_RAMP = 0.0009;
  let worldScroll = 0; // cumulative distance travelled, used for parallax + door numbering

  // ---------------------------------------------------------------
  // PLAYER
  // ---------------------------------------------------------------
  // w/h below are the collision box (kept tight and fair). Sprites
  // are drawn larger than this box — see PLAYER_DRAW_W/H — so the
  // linework doesn't look cropped.
  const PLAYER_DRAW_W = 101;
  const PLAYER_DRAW_H = 130;
  const PLAYER_KICK_DRAW_W = 141; // extra width so the kicking leg isn't clipped

  const player = {
    x: 80,
    y: GROUND_Y,
    w: 59,
    h: 81,
    vy: 0,
    onGround: true,
    kicking: false,
    kickTimer: 0,
    legPhase: 0
  };

  function jump() {
    if (player.onGround) {
      player.vy = JUMP_VELOCITY;
      player.onGround = false;
    }
  }

  function kick() {
    if (player.kicking) return;
    player.kicking = true;
    player.kickTimer = KICK_DURATION;
  }

  // ---------------------------------------------------------------
  // OBSTACLES / COLLECTIBLES
  // Two lanes conceptually: ground-level "bad things" and elevated
  // "coffee" that requires a jump to reach.
  // ---------------------------------------------------------------
  let entities = [];
  let popups = [];    // floating "+100" / "+5" / "Blarney!" score text
  let particles = []; // math symbols and clover confetti from kick bursts
  let spawnTimer = 0;
  let nextSpawnIn = 90;

  function spawnPopup(x, y, text, opts = {}) {
    popups.push({ x, y, text, age: 0, life: opts.life || 700, size: opts.size || 15 });
  }

  function spawnBookBurst(x, y) {
    const symbols = ["+", "\u2212", "\u00d7", "\u00f7", "=", "\u03c0", "\u221a", "\u03a3"];
    for (let i = 0; i < 9; i++) {
      const angle = Math.random() * Math.PI * 2;
      const spd = 1.8 + Math.random() * 3.2;
      particles.push({
        x, y,
        vx: Math.cos(angle) * spd,
        vy: Math.sin(angle) * spd - 1.5,
        rot: Math.random() * Math.PI * 2,
        vr: (Math.random() - 0.5) * 0.35,
        kind: "symbol",
        char: symbols[Math.floor(Math.random() * symbols.length)],
        size: 14 + Math.random() * 6,
        age: 0,
        life: 550 + Math.random() * 300
      });
    }
  }

  function spawnCloverBurst(x, y) {
    for (let i = 0; i < 10; i++) {
      const angle = Math.random() * Math.PI * 2;
      const spd = 1.6 + Math.random() * 3;
      particles.push({
        x, y,
        vx: Math.cos(angle) * spd,
        vy: Math.sin(angle) * spd - 1.2,
        rot: Math.random() * Math.PI * 2,
        vr: (Math.random() - 0.5) * 0.4,
        kind: Math.random() < 0.5 ? "circle" : "triangle",
        size: 5 + Math.random() * 4,
        age: 0,
        life: 500 + Math.random() * 300
      });
    }
  }

  function spawnEntity() {
    const roll = Math.random();
    if (roll < 0.27) {
      // plain obstacle — not kickable at all, must be jumped, always ends
      // the run on contact. This is the original silhouette hazard.
      const size = 30 + Math.random() * 14;
      entities.push({
        type: "bad",
        skin: "plain",
        kickable: false,
        elevated: false,
        x: W + size,
        y: GROUND_Y + (42 - size),
        w: size,
        h: size,
        resolved: false
      });
    } else if (roll < 0.54) {
      // ground-level kickable bad thing — jump over safely, or kick for +100
      const size = 30 + Math.random() * 14;
      entities.push({
        type: "bad",
        skin: Math.random() < 0.5 ? "book" : "clover",
        kickable: true,
        elevated: false,
        x: W + size,
        y: GROUND_Y + (42 - size), // align base to ground
        w: size,
        h: size,
        resolved: false
      });
    } else if (roll < 0.70) {
      // elevated kickable bad thing — sits above standing height, so it's
      // safe to ignore on the ground, but jumping into it without a kick
      // still ends the run. Jump AND kick it in midair for +100.
      const size = 28 + Math.random() * 12;
      entities.push({
        type: "bad",
        skin: Math.random() < 0.5 ? "book" : "clover",
        kickable: true,
        elevated: true,
        x: W + size,
        y: GROUND_Y - 130 - Math.random() * 40,
        w: size,
        h: size,
        resolved: false
      });
    } else {
      // coffee, elevated — needs a jump to grab
      const size = 26;
      entities.push({
        type: "coffee",
        x: W + size,
        y: GROUND_Y - 60 - Math.random() * 30,
        w: size,
        h: size,
        resolved: false,
        bob: Math.random() * Math.PI * 2
      });
    }
  }

  // ---------------------------------------------------------------
  // GAME STATE
  // ---------------------------------------------------------------
  let score = 0;
  let best = Number(localStorage.getItem("coffeeRunBest") || 0);
  let running = false;
  let gameOverFlag = false;
  let frame = 0;

  document.getElementById("best").textContent = best;

  function resetGame() {
    entities = [];
    popups = [];
    particles = [];
    score = 0;
    speed = 6.2;
    frame = 0;
    spawnTimer = 0;
    nextSpawnIn = 90;
    player.y = GROUND_Y;
    player.vy = 0;
    player.onGround = true;
    player.kicking = false;
    player.kickTimer = 0;
    gameOverFlag = false;
  }

  function endGame() {
    running = false;
    gameOverFlag = true;
    best = Math.max(best, Math.floor(score));
    localStorage.setItem("coffeeRunBest", best);
    document.getElementById("best").textContent = best;
    showOverlay(true);
  }

  function showOverlay(isGameOver) {
    const overlay = document.getElementById("overlay");
    overlay.classList.remove("hidden");
    const h1 = overlay.querySelector("h1");
    const btn = document.getElementById("start-btn");
    if (isGameOver) {
      h1.textContent = "Game Over";
      btn.textContent = "Run Again";
    } else {
      h1.textContent = "Coffee Run";
      btn.textContent = "Start";
    }
  }

  function hideOverlay() {
    document.getElementById("overlay").classList.add("hidden");
  }

  // ---------------------------------------------------------------
  // UPDATE
  // ---------------------------------------------------------------
  function rectsOverlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  function update(dt) {
    frame++;
    speed += SPEED_RAMP;
    score += speed * 0.045;
    worldScroll += speed;

    // player physics
    player.vy += GRAVITY;
    player.y += player.vy;
    if (player.y >= GROUND_Y) {
      player.y = GROUND_Y;
      player.vy = 0;
      player.onGround = true;
    }

    if (player.kicking) {
      player.kickTimer -= dt;
      if (player.kickTimer <= 0) player.kicking = false;
    }

    if (player.onGround) {
      player.legPhase += 0.35 * (speed / 6.2);
    }

    // spawn
    spawnTimer++;
    if (spawnTimer >= nextSpawnIn) {
      spawnEntity();
      spawnTimer = 0;
      nextSpawnIn = 55 + Math.random() * 55 - Math.min(speed * 2, 25);
      nextSpawnIn = Math.max(nextSpawnIn, 38);
    }

    // player hitbox (top-left based, matches drawing)
    const pBox = { x: player.x, y: player.y - player.h, w: player.w, h: player.h };
    // kick hitbox extends in front
    const kickBox = player.kicking
      ? { x: player.x + player.w, y: player.y - player.h, w: KICK_RANGE, h: player.h }
      : null;

    for (let i = entities.length - 1; i >= 0; i--) {
      const e = entities[i];
      e.x -= speed;

      if (e.x + e.w < -20) {
        entities.splice(i, 1);
        continue;
      }

      const eBox = { x: e.x, y: e.y - e.h, w: e.w, h: e.h };

      if (e.type === "bad" && !e.resolved) {
        if (e.kickable && kickBox && rectsOverlap(kickBox, eBox)) {
          e.resolved = true;
          score += 100;
          const cx = e.x + e.w / 2;
          const cy = e.y - e.h / 2;
          spawnPopup(e.x + e.w / 2, e.y - e.h, "+100");
          if (e.skin === "book") {
            spawnBookBurst(cx, cy);
          } else if (e.skin === "clover") {
            spawnCloverBurst(cx, cy);
            spawnPopup(cx, e.y - e.h - 20, "Blarney!", { size: 22, life: 900 });
          }
          entities.splice(i, 1);
          continue;
        }
        if (rectsOverlap(pBox, eBox)) {
          endGame();
          return;
        }
      }

      if (e.type === "coffee" && !e.resolved) {
        e.bob += 0.08;
        if (rectsOverlap(pBox, eBox)) {
          e.resolved = true;
          score += 5;
          spawnPopup(e.x + e.w / 2, e.y - e.h, "+5");
          entities.splice(i, 1);
        }
      }
    }

    // age out floating score popups
    for (let i = popups.length - 1; i >= 0; i--) {
      popups[i].age += dt;
      popups[i].y -= dt * 0.04; // drift upward
      popups[i].x -= speed * 0.6;
      if (popups[i].age >= popups[i].life) popups.splice(i, 1);
    }

    // age out and move burst particles (math symbols, clover bits)
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.age += dt;
      p.x += p.vx - speed * 0.6;
      p.y += p.vy;
      p.vy += 0.05;
      p.rot += p.vr;
      if (p.age >= p.life) particles.splice(i, 1);
    }
  }

  // ---------------------------------------------------------------
  // DRAW HELPERS (fallback silhouettes, B&W, simple geometry)
  // ---------------------------------------------------------------
  const WALL_TOP = 0;
  const WALL_BOTTOM = GROUND_Y - 6;   // cinder block wall ends just above floor
  const BLOCK_W = 40;
  const BLOCK_H = 24;
  const DOOR_SPACING = 320;
  const DOOR_W = 60;
  const DOOR_H = 130;

  function drawHallway() {
    // --- wall: light gray cinder block field ---
    ctx.fillStyle = "#e9e9e9";
    ctx.fillRect(0, WALL_TOP, W, WALL_BOTTOM - WALL_TOP);

    const parallax = 0.5; // wall scrolls slower than the foreground for depth
    const wallShift = worldScroll * parallax;

    ctx.strokeStyle = "#c7c7c7";
    ctx.lineWidth = 1;

    // horizontal courses
    for (let y = WALL_TOP; y <= WALL_BOTTOM; y += BLOCK_H) {
      ctx.beginPath();
      ctx.moveTo(0, y + 0.5);
      ctx.lineTo(W, y + 0.5);
      ctx.stroke();
    }

    // vertical joints, offset alternately per course (running bond)
    let course = 0;
    for (let y = WALL_TOP; y < WALL_BOTTOM; y += BLOCK_H, course++) {
      const rowOffset = (course % 2 === 0) ? 0 : BLOCK_W / 2;
      const shift = (wallShift + rowOffset) % BLOCK_W;
      for (let x = W + BLOCK_W - shift; x > -BLOCK_W; x -= BLOCK_W) {
        ctx.beginPath();
        ctx.moveTo(x + 0.5, y);
        ctx.lineTo(x + 0.5, Math.min(y + BLOCK_H, WALL_BOTTOM));
        ctx.stroke();
      }
    }

    // --- doors, evenly spaced along the hall, each with a number plaque ---
    const doorShift = wallShift % DOOR_SPACING;
    for (let x = W + DOOR_SPACING - doorShift; x > -DOOR_SPACING; x -= DOOR_SPACING) {
      const doorX = x - DOOR_W / 2;
      const doorY = WALL_BOTTOM - DOOR_H;

      // door frame
      ctx.fillStyle = "#ffffff";
      ctx.strokeStyle = "#000000";
      ctx.lineWidth = 2;
      ctx.fillRect(doorX, doorY, DOOR_W, DOOR_H);
      ctx.strokeRect(doorX, doorY, DOOR_W, DOOR_H);

      // recessed panel line
      ctx.strokeStyle = "#999999";
      ctx.lineWidth = 1;
      ctx.strokeRect(doorX + 6, doorY + 8, DOOR_W - 12, DOOR_H - 20);

      // door knob
      ctx.fillStyle = "#000000";
      ctx.beginPath();
      ctx.arc(doorX + DOOR_W - 9, doorY + DOOR_H * 0.55, 2.4, 0, Math.PI * 2);
      ctx.fill();

      // number plaque above the door
      const doorNumber = 100 + Math.floor((x + worldScroll * parallax) / DOOR_SPACING);
      const plaqueW = 32, plaqueH = 16;
      const plaqueX = x - plaqueW / 2, plaqueY = doorY - plaqueH - 5;
      ctx.fillStyle = "#000000";
      ctx.fillRect(plaqueX, plaqueY, plaqueW, plaqueH);
      ctx.fillStyle = "#ffffff";
      ctx.font = "11px 'Courier New', monospace";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(String(doorNumber), x, plaqueY + plaqueH / 2 + 1);
    }

    // baseboard
    ctx.strokeStyle = "#000000";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, WALL_BOTTOM);
    ctx.lineTo(W, WALL_BOTTOM);
    ctx.stroke();

    // --- floor: simple tile grid ---
    ctx.fillStyle = "#f4f4f4";
    ctx.fillRect(0, WALL_BOTTOM, W, H - WALL_BOTTOM);

    ctx.strokeStyle = "#d2d2d2";
    ctx.lineWidth = 1;
    const tileSize = 42;
    const floorShift = worldScroll % tileSize;
    for (let x = W + tileSize - floorShift; x > -tileSize; x -= tileSize) {
      ctx.beginPath();
      ctx.moveTo(x + 0.5, WALL_BOTTOM);
      ctx.lineTo(x + 0.5, H);
      ctx.stroke();
    }
    for (let y = WALL_BOTTOM; y < H; y += tileSize) {
      ctx.beginPath();
      ctx.moveTo(0, y + 0.5);
      ctx.lineTo(W, y + 0.5);
      ctx.stroke();
    }

    // ground contact line where the player actually runs
    ctx.strokeStyle = "#000000";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, GROUND_Y + 1);
    ctx.lineTo(W, GROUND_Y + 1);
    ctx.stroke();
  }

  function drawPlayer() {
    // pick the right sprite for the current state
    let sprite = null;
    let drawW = PLAYER_DRAW_W, drawH = PLAYER_DRAW_H;
    if (player.kicking && loadedImages.playerKick) {
      sprite = loadedImages.playerKick;
      drawW = PLAYER_KICK_DRAW_W;
    } else if (!player.onGround && loadedImages.playerJump) {
      sprite = loadedImages.playerJump;
    } else if (loadedImages.player) {
      sprite = loadedImages.player;
    }

    if (sprite) {
      // anchor: horizontally centered on the collision box, feet on the ground line
      const cx = player.x + player.w / 2;
      const drawX = cx - drawW / 2;
      const drawY = player.y - drawH;

      ctx.save();
      if (MIRROR_PLAYER_SPRITES) {
        ctx.translate(drawX + drawW, drawY);
        ctx.scale(-1, 1);
        ctx.drawImage(sprite, 0, 0, drawW, drawH);
      } else {
        ctx.drawImage(sprite, drawX, drawY, drawW, drawH);
      }
      ctx.restore();
      return;
    }

    // fallback: simple silhouette runner
    ctx.fillStyle = "#000000";
    const x = player.x, y = player.y - player.h, w = player.w, h = player.h;

    // body
    ctx.fillRect(x + w * 0.25, y + h * 0.15, w * 0.5, h * 0.5);
    // head
    ctx.fillRect(x + w * 0.3, y, w * 0.4, h * 0.2);

    if (player.kicking) {
      // extended leg forward
      ctx.fillRect(x + w * 0.6, y + h * 0.55, w * 0.75, h * 0.14);
      ctx.fillRect(x, y + h * 0.65, w * 0.35, h * 0.35);
    } else if (player.onGround) {
      const swing = Math.sin(player.legPhase) * (h * 0.18);
      ctx.fillRect(x + w * 0.28, y + h * 0.62, w * 0.18, h * 0.38 + swing);
      ctx.fillRect(x + w * 0.54, y + h * 0.62, w * 0.18, h * 0.38 - swing);
    } else {
      // airborne, tucked legs
      ctx.fillRect(x + w * 0.28, y + h * 0.6, w * 0.18, h * 0.3);
      ctx.fillRect(x + w * 0.54, y + h * 0.6, w * 0.18, h * 0.3);
    }
  }

  function drawContained(img, boxX, boxBottomY, boxW, boxH) {
    // fits img within a box (preserving aspect ratio), centered horizontally,
    // anchored to the bottom of the box — keeps collision boxes simple/square
    // while letting non-square art (mugs, books, etc.) render undistorted.
    const scale = Math.min(boxW / img.width, boxH / img.height);
    const drawW = img.width * scale;
    const drawH = img.height * scale;
    const drawX = boxX + (boxW - drawW) / 2;
    const drawY = boxBottomY - drawH;
    ctx.drawImage(img, drawX, drawY, drawW, drawH);
  }

  function drawEntity(e) {
    if (e.type === "bad") {
      const skinImage = e.skin === "plain" ? null
        : (e.skin === "clover" ? loadedImages.clover : loadedImages.obstacle);
      if (skinImage) {
        // give obstacle art a bit more room than the tight collision box
        const pad = e.w * 0.5;
        drawContained(skinImage, e.x - pad / 2, e.y, e.w + pad, e.h + pad);
        return;
      }
      ctx.fillStyle = "#000000";
      // jagged silhouette block, reads as "bad thing"
      ctx.beginPath();
      const x = e.x, y = e.y - e.h, w = e.w, h = e.h;
      ctx.moveTo(x, y + h);
      ctx.lineTo(x + w * 0.15, y + h * 0.3);
      ctx.lineTo(x + w * 0.4, y + h * 0.55);
      ctx.lineTo(x + w * 0.6, y);
      ctx.lineTo(x + w * 0.8, y + h * 0.4);
      ctx.lineTo(x + w, y + h * 0.2);
      ctx.lineTo(x + w, y + h);
      ctx.closePath();
      ctx.fill();
    } else {
      const bobY = e.y + Math.sin(e.bob || 0) * 3;
      if (loadedImages.coffee) {
        const pad = e.w * 0.4;
        drawContained(loadedImages.coffee, e.x - pad / 2, bobY, e.w + pad, e.h + pad);
        return;
      }
      ctx.strokeStyle = "#000000";
      ctx.lineWidth = 2;
      // simple cup silhouette
      const x = e.x, y = bobY - e.h, w = e.w, h = e.h;
      ctx.strokeRect(x + w * 0.15, y + h * 0.25, w * 0.6, h * 0.65);
      ctx.beginPath();
      ctx.arc(x + w * 0.8, y + h * 0.5, w * 0.18, -Math.PI * 0.6, Math.PI * 0.6);
      ctx.stroke();
      // steam
      ctx.beginPath();
      ctx.moveTo(x + w * 0.3, y + h * 0.15);
      ctx.quadraticCurveTo(x + w * 0.4, y, x + w * 0.35, y - h * 0.15);
      ctx.stroke();
    }
  }

  function drawPopups() {
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    for (const p of popups) {
      const t = p.age / p.life;
      const opacity = 1 - t;
      ctx.font = `bold ${p.size}px 'Courier New', monospace`;
      ctx.fillStyle = `rgba(0,0,0,${opacity.toFixed(3)})`;
      ctx.fillText(p.text, p.x, p.y);
    }
  }

  function drawParticles() {
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    for (const p of particles) {
      const t = p.age / p.life;
      const opacity = 1 - t;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.globalAlpha = opacity;
      ctx.fillStyle = "#000000";
      if (p.kind === "symbol") {
        ctx.font = `bold ${p.size}px 'Courier New', monospace`;
        ctx.fillText(p.char, 0, 0);
      } else if (p.kind === "circle") {
        ctx.beginPath();
        ctx.arc(0, 0, p.size / 2, 0, Math.PI * 2);
        ctx.fill();
      } else if (p.kind === "triangle") {
        ctx.beginPath();
        ctx.moveTo(0, -p.size / 2);
        ctx.lineTo(p.size / 2, p.size / 2);
        ctx.lineTo(-p.size / 2, p.size / 2);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    if (loadedImages.background) {
      ctx.drawImage(loadedImages.background, 0, 0, W, H);
    }

    drawHallway();
    entities.forEach(drawEntity);
    drawPlayer();
    drawParticles();
    drawPopups();
  }

  // ---------------------------------------------------------------
  // LOOP
  // ---------------------------------------------------------------
  let lastTime = 0;
  function loop(ts) {
    const dt = ts - lastTime;
    lastTime = ts;

    if (running) {
      update(dt || 16);
      document.getElementById("score").textContent = Math.floor(score);
    }
    draw();
    requestAnimationFrame(loop);
  }

  // ---------------------------------------------------------------
  // INPUT
  // ---------------------------------------------------------------
  function handleStart() {
    if (running) return;
    resetGame();
    running = true;
    hideOverlay();
  }

  window.addEventListener("keydown", (e) => {
    if (e.code === "Space" || e.code === "ArrowUp") {
      e.preventDefault();
      if (!running && !gameOverFlag) return; // overlay handles first start via button
      if (!running && gameOverFlag) return;
      jump();
    }
    if (e.code === "ArrowDown" || e.code === "KeyK") {
      e.preventDefault();
      if (running) kick();
    }
  });

  document.getElementById("start-btn").addEventListener("click", handleStart);

  document.getElementById("touch-jump").addEventListener("touchstart", (e) => {
    e.preventDefault();
    if (running) jump();
  });
  document.getElementById("touch-kick").addEventListener("touchstart", (e) => {
    e.preventDefault();
    if (running) kick();
  });

  // allow tap-to-jump on canvas itself for mobile convenience
  canvas.addEventListener("touchstart", (e) => {
    if (running) { e.preventDefault(); jump(); }
  });

  requestAnimationFrame(loop);
})();
</script>

</body>
</html>
