<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>
<!-- set theme before paint to avoid a flash of the wrong look -->
<script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('dashboard-theme')||'editorial');}catch(e){document.documentElement.setAttribute('data-theme','editorial');}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Montserrat:wght@400;500;600;700&family=Share+Tech+Mono&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     TWO THEMES, ONE SWITCH
       editorial : warm paper · Fraunces + Source Sans · teal
       vfd       : dark glass · Share Tech Mono · cyan + amber glow
     :root defaults = editorial;  [data-theme="vfd"] overrides.
     ============================================================ */
  :root {
    --ground:      #F4F1EA;
    --surface:     #FFFFFF;
    --surface-2:   #FAF7F1;
    --ink:         #322F2A;
    --muted:       #837C70;
    --line:        #E5DFD3;
    --accent:      #2C6E63;
    --accent-deep: #235A50;
    --accent-tint: rgba(44,110,99,.10);
    --danger:      #B5462F;
    --shadow: 0 1px 2px rgba(50,47,42,.06), 0 6px 18px rgba(50,47,42,.05);
    --radius: 12px;

    --masthead-bg:     #FFFFFF;
    --masthead-border: var(--line);
    --masthead-shadow: 0 1px 8px rgba(50,47,42,.04);

    --display-font: 'Fraunces', Georgia, serif;
    --label-font:   'Source Sans 3', sans-serif;
    --body-font:    'Source Sans 3', system-ui, sans-serif;

    --embed-filter: none;

    /* the two main panels' height — nudge if the doc page doesn't fit */
    --panel-h: 1040px;
  }

  :root[data-theme="vfd"] {
    --ground:      #05080A;
    --surface:     #0D1416;
    --surface-2:   #070B0D;
    --ink:         #D6E6E2;
    --muted:       #6B8582;
    --line:        #1E2E2C;
    --accent:      #5FF5D0;
    --accent-deep: #3FD9B4;
    --accent-tint: rgba(95,245,208,.10);
    --danger:      #FF6B5E;
    --shadow: 0 2px 20px rgba(0,0,0,.5);
    --radius: 14px;

    --masthead-bg:     radial-gradient(120% 140% at 50% 0%, #121A18 0%, #0A0E0D 70%);
    --masthead-border: #000;
    --masthead-shadow: 0 2px 22px rgba(0,0,0,.6);

    --display-font: 'Share Tech Mono', ui-monospace, monospace;
    --label-font:   'Share Tech Mono', ui-monospace, monospace;
    --body-font:    'Montserrat', system-ui, sans-serif;

    --embed-filter: invert(0.92) hue-rotate(180deg) saturate(0.85) contrast(0.95);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }

  body {
    font-family: var(--body-font);
    background: var(--ground);
    color: var(--ink);
    min-height: 100vh;
    display: flex; flex-direction: column;
    -webkit-font-smoothing: antialiased;
    transition: background .25s ease, color .25s ease;
  }

  /* ============================================================
     MASTHEAD
     ============================================================ */
  .masthead {
    position: sticky; top: 0; z-index: 50;
    background: var(--masthead-bg);
    border-bottom: 1px solid var(--masthead-border);
    box-shadow: var(--masthead-shadow);
    padding: 16px 28px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 22px; flex-wrap: wrap;
  }
  .scanlines {
    position: absolute; inset: 0; overflow: hidden; pointer-events: none; opacity: 0;
    background: repeating-linear-gradient(to bottom,
      rgba(255,255,255,.035) 0px, rgba(255,255,255,.035) 1px, transparent 1px, transparent 3px);
    mix-blend-mode: screen; transition: opacity .25s ease;
  }
  [data-theme="vfd"] .scanlines { opacity: 1; }

  .display { position: relative; z-index: 1; min-width: 0; }
  .mast-date {
    font-family: var(--display-font); font-weight: 500;
    font-size: clamp(26px, 3.8vw, 42px); line-height: 1.15; letter-spacing: -.3px;
    color: var(--ink); white-space: nowrap;
  }
  .mast-sub {
    margin-top: 4px; font-family: var(--label-font);
    font-size: 12px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase;
    color: var(--muted);
  }
  .mast-sub .yr { color: var(--accent); }

  /* vfd display treatment */
  [data-theme="vfd"] .mast-date {
    color: var(--accent); text-transform: uppercase; letter-spacing: 3px;
    text-shadow: 0 0 4px rgba(95,245,208,.9), 0 0 14px rgba(95,245,208,.55), 0 0 34px rgba(95,245,208,.28);
  }
  [data-theme="vfd"] .mast-date .sep { color: #FFB53C; text-shadow: 0 0 4px rgba(255,181,60,.9), 0 0 16px rgba(255,181,60,.5); margin: 0 6px; }
  [data-theme="vfd"] .mast-date .yr  { color: #2E4A44; text-shadow: none; }
  [data-theme="vfd"] .mast-sub { color: #FFB53C; letter-spacing: 4px; text-shadow: 0 0 6px rgba(255,181,60,.55), 0 0 18px rgba(255,181,60,.25); }

  .mast-right { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; position: relative; z-index: 1; }

  /* quick links */
  .links { display: flex; gap: 9px; flex-wrap: wrap; }
  .link {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 9px 15px; border-radius: 9px;
    background: var(--surface); border: 1px solid var(--line); color: var(--ink);
    text-decoration: none; font-family: var(--label-font);
    font-size: 13px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase;
    transition: background .15s ease, border-color .15s ease, color .15s ease, transform .15s ease, box-shadow .15s ease;
  }
  .link:hover {
    background: var(--accent-tint); border-color: var(--accent); color: var(--accent-deep);
    transform: translateY(-1px); box-shadow: 0 3px 10px rgba(44,110,99,.12);
  }
  .link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .link .pip { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: none; }

  /* vfd link treatment */
  [data-theme="vfd"] .link {
    background: rgba(95,245,208,.05); border-color: rgba(95,245,208,.28); color: var(--accent);
    text-shadow: 0 0 6px rgba(95,245,208,.5);
  }
  [data-theme="vfd"] .link:hover {
    background: rgba(255,181,60,.12); border-color: #FFB53C; color: #FFB53C;
    text-shadow: 0 0 8px rgba(255,181,60,.8); box-shadow: 0 0 16px rgba(255,181,60,.22);
  }
  [data-theme="vfd"] .link .pip { background: currentColor; border-radius: 1px; box-shadow: 0 0 6px currentColor; }

  /* ---- theme toggle ---- */
  .theme-toggle {
    display: inline-flex; align-items: center; gap: 9px;
    background: none; border: 0; cursor: pointer; padding: 6px 2px; font-family: var(--label-font);
  }
  .theme-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
  .tt-track {
    width: 44px; height: 24px; border-radius: 999px; flex: none; position: relative;
    background: var(--surface-2); border: 1px solid var(--line);
    transition: background .18s ease, border-color .18s ease;
  }
  .tt-knob {
    position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%;
    background: var(--accent); transition: transform .18s ease, background .18s ease, box-shadow .18s ease;
  }
  [data-theme="vfd"] .tt-track { background: rgba(95,245,208,.12); border-color: rgba(95,245,208,.35); }
  [data-theme="vfd"] .tt-knob  { transform: translateX(20px); box-shadow: 0 0 8px rgba(95,245,208,.6); }
  .tt-label {
    font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--muted); min-width: 62px; text-align: left;
  }
  [data-theme="vfd"] .tt-label { color: var(--accent); text-shadow: 0 0 6px rgba(95,245,208,.4); }

  /* ============================================================
     LAYOUT
     ============================================================ */
  .grid {
    flex: 1; display: grid; grid-template-columns: 378px minmax(0, 1fr);
    gap: 14px; padding: 14px; max-width: none; width: 100%; margin: 0; align-items: stretch;
  }
  .panel {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow); display: flex; flex-direction: column; overflow: hidden;
    min-width: 0; min-height: var(--panel-h);
  }
  .panel-head {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 0 16px; min-height: 48px; background: var(--surface-2); border-bottom: 1px solid var(--line);
  }
  .panel-title {
    font-family: var(--label-font); font-size: 13px; font-weight: 700; letter-spacing: 1.5px;
    text-transform: uppercase; color: var(--accent);
  }
  [data-theme="vfd"] .panel-title { text-shadow: 0 0 8px rgba(95,245,208,.35); }
  .panel-link {
    font-family: var(--label-font); font-size: 12px; font-weight: 600; letter-spacing: .5px;
    color: var(--muted); text-decoration: none; white-space: nowrap; transition: color .15s ease;
  }
  .panel-link:hover { color: var(--accent); }

  /* ---- tabbed panel ---- */
  .tabs { display: flex; gap: 4px; height: 100%; }
  .tab {
    font-family: var(--label-font); font-size: 13px; font-weight: 700; letter-spacing: 1px;
    text-transform: uppercase; padding: 0 16px; border: 0; cursor: pointer;
    background: transparent; color: var(--muted); border-bottom: 2px solid transparent;
    transition: color .15s ease, border-color .15s ease;
  }
  .tab:hover { color: var(--ink); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  [data-theme="vfd"] .tab.active { text-shadow: 0 0 8px rgba(95,245,208,.5); }
  .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

  .tab-body { flex: 1; position: relative; display: flex; }
  .tab-frame { flex: 1; width: 100%; border: 0; background: #fff; filter: var(--embed-filter); }
  .tab-frame[hidden] { display: none; }

  /* ============================================================
     TO-DO
     ============================================================ */
  .todo-add { display: flex; gap: 8px; padding: 13px 14px; border-bottom: 1px solid var(--line); }
  .todo-input {
    flex: 1; min-width: 0; font-family: var(--body-font); font-size: 15px;
    padding: 11px 12px; border: 1px solid var(--line); border-radius: 9px;
    color: var(--ink); background: var(--ground);
  }
  .todo-input::placeholder { color: var(--muted); }
  .todo-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-tint); }

  .todo-addbtn {
    flex: none; width: 40px; border: 0; border-radius: 9px; font-size: 22px; line-height: 1; cursor: pointer;
    background: var(--accent); color: #fff; transition: background .15s ease, box-shadow .15s ease;
  }
  .todo-addbtn:hover { background: var(--accent-deep); }
  .todo-addbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  [data-theme="vfd"] .todo-addbtn {
    background: rgba(95,245,208,.12); border: 1px solid rgba(95,245,208,.35);
    color: var(--accent); text-shadow: 0 0 8px rgba(95,245,208,.6);
  }
  [data-theme="vfd"] .todo-addbtn:hover { background: rgba(95,245,208,.22); box-shadow: 0 0 14px rgba(95,245,208,.25); }

  .todo-list { flex: 1; overflow-y: auto; padding: 8px; list-style: none; }
  .todo-item { display: flex; align-items: center; gap: 11px; padding: 12px 9px; border-radius: 9px; transition: background .12s ease; cursor: grab; }
  .todo-item:hover { background: var(--surface-2); }
  .todo-item.dragging { opacity: .45; cursor: grabbing; background: var(--accent-tint); }
  .todo-item:hover .todo-del { opacity: 1; }

  .todo-check {
    flex: none; width: 22px; height: 22px; border: 2px solid var(--line); border-radius: 6px;
    cursor: pointer; display: grid; place-items: center;
    transition: border-color .12s ease, background .12s ease, box-shadow .12s ease;
  }
  .todo-check:hover { border-color: var(--accent); }
  .todo-item.done .todo-check { background: var(--accent); border-color: var(--accent); }
  .todo-check svg { width: 13px; height: 13px; stroke: #fff; stroke-width: 3; fill: none; opacity: 0; }
  .todo-item.done .todo-check svg { opacity: 1; }
  [data-theme="vfd"] .todo-item.done .todo-check { background: rgba(95,245,208,.18); box-shadow: 0 0 10px rgba(95,245,208,.3); }
  [data-theme="vfd"] .todo-check svg { stroke: var(--accent); }

  /* the completion color-shift: neutral -> accent */
  .todo-text { flex: 1; font-size: 16px; line-height: 1.35; word-break: break-word; color: var(--ink); }
  .todo-item.done .todo-text { color: var(--accent); text-decoration: line-through; text-decoration-color: rgba(44,110,99,.5); }
  [data-theme="vfd"] .todo-text { color: #FFB53C; text-shadow: 0 0 8px rgba(255,181,60,.3); }
  [data-theme="vfd"] .todo-item.done .todo-text { color: var(--accent); text-shadow: 0 0 8px rgba(95,245,208,.3); text-decoration-color: rgba(95,245,208,.55); }

  .todo-del {
    flex: none; border: 0; background: none; color: var(--muted); font-size: 18px; line-height: 1;
    cursor: pointer; opacity: 0; padding: 3px 6px; border-radius: 6px;
    transition: opacity .12s ease, color .12s ease, background .12s ease;
  }
  .todo-del:hover { color: var(--danger); background: rgba(181,70,47,.08); }
  .todo-del:focus-visible { opacity: 1; outline: 2px solid var(--accent); }

  .todo-empty { padding: 40px 22px; text-align: center; color: var(--muted); font-size: 14px; line-height: 1.6; }
  .todo-foot {
    padding: 12px 14px; border-top: 1px solid var(--line); background: var(--surface-2);
    font-family: var(--label-font); font-size: 12px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase;
    color: var(--muted); display: flex; justify-content: space-between; align-items: center; gap: 8px;
  }
  .todo-clear {
    border: 0; background: none; color: var(--muted); font-family: var(--label-font);
    font-size: 12px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; text-decoration: underline;
  }
  .todo-clear:hover { color: var(--danger); }

  /* ============================================================
     RESPONSIVE
     ============================================================ */
  @media (max-width: 900px) {
    :root { --panel-h: 70vh; }
    .grid { grid-template-columns: minmax(0, 1fr); padding: 12px; }
    .masthead { padding: 14px 16px; }
    .tab { padding: 0 12px; font-size: 12px; letter-spacing: .5px; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

  <!-- ============ MASTHEAD ============ -->
  <header class="masthead">
    <div class="scanlines" aria-hidden="true"></div>

    <div class="display">
      <div class="mast-date" id="mastDate">&nbsp;</div>
      <div class="mast-sub"  id="mastSub"></div>
    </div>

    <div class="mast-right">
      <nav class="links" id="links" aria-label="Quick links"></nav>
      <button class="theme-toggle" id="themeToggle" role="switch" aria-checked="false" aria-label="Toggle display theme">
        <span class="tt-track"><span class="tt-knob"></span></span>
        <span class="tt-label" id="ttLabel">Editorial</span>
      </button>
    </div>
  </header>

  <!-- ============ GRID ============ -->
  <main class="grid">

    <!-- TO-DO -->
    <aside class="panel todo-panel">
      <div class="panel-head"><span class="panel-title">To-Do</span></div>
      <div class="todo-add">
        <input class="todo-input" id="todoInput" type="text" placeholder="Add a task…" autocomplete="off">
        <button class="todo-addbtn" id="todoAdd" aria-label="Add task">+</button>
      </div>
      <ul class="todo-list" id="todoList"></ul>
      <div class="todo-foot">
        <span id="todoCount">0 OPEN</span>
        <button class="todo-clear" id="todoClear">Clear done</button>
      </div>
    </aside>

    <!-- TABBED : BVA Planning Calendar (doc)  <->  Google Calendar -->
    <section class="panel">
      <div class="panel-head">
        <div class="tabs" role="tablist">
          <button class="tab active" role="tab" data-tab="bva"  id="tabBva">BVA Planning Calendar</button>
          <button class="tab"        role="tab" data-tab="gcal" id="tabGcal">Google Calendar</button>
        </div>
        <a class="panel-link" id="tabExternal" target="_blank" rel="noopener"
           href="https://docs.google.com/document/d/1h-wb4hnfBrN6WwA5_01LOIwjwqNHosFzHEoeYS1Pu7I/edit">Open to edit &rarr;</a>
      </div>
      <div class="tab-body">
        <iframe class="tab-frame" id="paneBva" title="BVA Planning Calendar"
          src="https://docs.google.com/document/d/1h-wb4hnfBrN6WwA5_01LOIwjwqNHosFzHEoeYS1Pu7I/preview"></iframe>
        <iframe class="tab-frame" id="paneGcal" title="Google Calendar" hidden
          src="https://calendar.google.com/calendar/embed?ctz=America%2FChicago&mode=MONTH&showTitle=0&showPrint=0&showCalendars=0&src=khuebner88%40gmail.com&color=%230B5394&src=audraboxy%40gmail.com&color=%23E0A100"></iframe>
      </div>
    </section>

  </main>

<script>
/* ============================================================
   QUICK LINKS
   ============================================================ */
const QUICK_LINKS = [
  { label: "Canvas",  url: "https://canvasdiscover.bluevalleyk12.org/" },
  { label: "Outlook", url: "https://outlook.cloud.microsoft/mail/" },
  { label: "Claude",  url: "https://claude.ai" },
  { label: "Drive",   url: "https://drive.google.com" },
  { label: "Gmail",   url: "https://mail.google.com" },
  { label: "Game",    url: "https://kthuebner.github.io/homepage/huebgame.html" },
];
(function () {
  const nav = document.getElementById('links');
  QUICK_LINKS.forEach(function (l) {
    const a = document.createElement('a');
    a.className = 'link'; a.href = l.url; a.target = '_blank'; a.rel = 'noopener';
    a.innerHTML = '<span class="pip"></span>' + l.label;
    nav.appendChild(a);
  });
})();

/* ============================================================
   THEME TOGGLE  —  editorial  <->  vfd  (persisted)
   ============================================================ */
const THEME_KEY = 'dashboard-theme';
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  const tog = document.getElementById('themeToggle');
  tog.setAttribute('aria-checked', t === 'vfd' ? 'true' : 'false');
  document.getElementById('ttLabel').textContent = t === 'vfd' ? 'VFD' : 'Editorial';
  paintDate();
}
document.getElementById('themeToggle').addEventListener('click', function () {
  const next = document.documentElement.getAttribute('data-theme') === 'vfd' ? 'editorial' : 'vfd';
  try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
  applyTheme(next);
});

/* ============================================================
   TABS  —  doc  <->  calendar, adaptive header link
   ============================================================ */
const EXTERNAL = {
  bva:  { href: 'https://docs.google.com/document/d/1h-wb4hnfBrN6WwA5_01LOIwjwqNHosFzHEoeYS1Pu7I/edit', text: 'Open to edit \u2192' },
  gcal: { href: 'https://calendar.google.com/calendar/u/0/r/month', text: 'Open in Google \u2192' }
};
function switchTab(name) {
  document.querySelectorAll('.tab').forEach(function (b) { b.classList.toggle('active', b.dataset.tab === name); });
  document.getElementById('paneBva').hidden  = (name !== 'bva');
  document.getElementById('paneGcal').hidden = (name !== 'gcal');
  const ext = document.getElementById('tabExternal');
  ext.href = EXTERNAL[name].href; ext.textContent = EXTERNAL[name].text;
}
document.querySelectorAll('.tab').forEach(function (b) {
  b.addEventListener('click', function () { switchTab(b.dataset.tab); });
});

/* ============================================================
   DATE DISPLAY  —  format follows the active theme
   ============================================================ */
function paintDate() {
  const now = new Date();
  const dateEl = document.getElementById('mastDate');
  const subEl  = document.getElementById('mastSub');
  const h = now.getHours();
  const greet = h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';

  if (document.documentElement.getAttribute('data-theme') === 'vfd') {
    const dow = now.toLocaleDateString('en-US', { weekday: 'short' });
    const mon = now.toLocaleDateString('en-US', { month: 'short' });
    dateEl.innerHTML = dow + '<span class="sep">/</span>' + mon + ' ' + now.getDate() +
                       '<span class="sep">/</span><span class="yr">' + now.getFullYear() + '</span>';
    subEl.textContent = greet;
  } else {
    dateEl.textContent = now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
    subEl.innerHTML = greet + ' &nbsp;·&nbsp; <span class="yr">' + now.getFullYear() + '</span>';
  }
}

/* sync toggle UI + date to whatever theme the head script set */
applyTheme(document.documentElement.getAttribute('data-theme') || 'editorial');
setInterval(paintDate, 60 * 1000);

/* ============================================================
   TO-DO  —  persists per-browser via localStorage
     · completed tasks sink to the bottom
     · drag rows to reorder (desktop)
   ============================================================ */
const KEY = 'dashboard-todos';
function uid() { return 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

let todos = [];
try { todos = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { todos = []; }

const listEl  = document.getElementById('todoList');
const inputEl = document.getElementById('todoInput');
const countEl = document.getElementById('todoCount');

function save() { try { localStorage.setItem(KEY, JSON.stringify(todos)); } catch (e) {} }

/* give any older saved tasks a stable id */
(function () {
  let changed = false;
  todos.forEach(function (t) { if (!t.id) { t.id = uid(); changed = true; } });
  if (changed) save();
})();

function byId(id)   { return todos.find(function (t) { return t.id === id; }); }
function toggle(id) { const t = byId(id); if (t) { t.done = !t.done; save(); render(); } }
function remove(id) { todos = todos.filter(function (t) { return t.id !== id; }); save(); render(); }
function add(text)  { text = text.trim(); if (!text) return; todos.push({ id: uid(), text: text, done: false }); save(); render(); }

/* open tasks first (in their manual order), completed pushed to the bottom */
function displayOrder() {
  return todos.filter(function (t) { return !t.done; })
              .concat(todos.filter(function (t) { return t.done; }));
}

function render() {
  listEl.innerHTML = '';
  if (todos.length === 0) {
    listEl.innerHTML = '<li class="todo-empty">Nothing here yet.<br>Add your first task above.</li>';
    countEl.textContent = '0 OPEN';
    return;
  }
  displayOrder().forEach(function (t) {
    const li = document.createElement('li');
    li.className = 'todo-item' + (t.done ? ' done' : '');
    li.dataset.id = t.id;
    li.draggable = true;
    li.innerHTML =
      '<span class="todo-check" role="checkbox" tabindex="0" aria-checked="' + t.done + '">' +
        '<svg viewBox="0 0 16 16"><polyline points="3,8 7,12 13,4"/></svg></span>' +
      '<span class="todo-text"></span>' +
      '<button class="todo-del" aria-label="Delete task">&times;</button>';
    li.querySelector('.todo-text').textContent = t.text;
    li.querySelector('.todo-check').addEventListener('click', function () { toggle(t.id); });
    li.querySelector('.todo-check').addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(t.id); }
    });
    li.querySelector('.todo-del').addEventListener('click', function () { remove(t.id); });
    li.addEventListener('dragstart', function () { li.classList.add('dragging'); });
    li.addEventListener('dragend',   function () { li.classList.remove('dragging'); commitOrder(); });
    listEl.appendChild(li);
  });
  const open = todos.filter(function (t) { return !t.done; }).length;
  countEl.textContent = open + ' OPEN';
}

/* live reorder while dragging */
function getDragAfterElement(y) {
  const els = Array.prototype.slice.call(listEl.querySelectorAll('.todo-item:not(.dragging)'));
  let closest = { offset: -Infinity, element: null };
  els.forEach(function (child) {
    const box = child.getBoundingClientRect();
    const offset = y - box.top - box.height / 2;
    if (offset < 0 && offset > closest.offset) { closest = { offset: offset, element: child }; }
  });
  return closest.element;
}
listEl.addEventListener('dragover', function (e) {
  e.preventDefault();
  const dragging = listEl.querySelector('.dragging');
  if (!dragging) return;
  const after = getDragAfterElement(e.clientY);
  if (after == null) listEl.appendChild(dragging);
  else listEl.insertBefore(dragging, after);
});

/* read the new DOM order back into the todos array */
function commitOrder() {
  const ids = Array.prototype.slice.call(listEl.querySelectorAll('.todo-item')).map(function (el) { return el.dataset.id; });
  todos.sort(function (a, b) { return ids.indexOf(a.id) - ids.indexOf(b.id); });
  save(); render();
}

document.getElementById('todoAdd').addEventListener('click', function () { add(inputEl.value); inputEl.value = ''; inputEl.focus(); });
inputEl.addEventListener('keydown', function (e) { if (e.key === 'Enter') { add(inputEl.value); inputEl.value = ''; } });
document.getElementById('todoClear').addEventListener('click', function () { todos = todos.filter(function (t) { return !t.done; }); save(); render(); });

render();
</script>
</body>
</html>
