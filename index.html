<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     DESIGN TOKENS  —  VFD / dark instrument panel
     ============================================================ */
  :root {
    --ground:     #05080A;
    --surface:    #0D1416;
    --surface-2:  #070B0D;
    --line:       #1E2E2C;
    --ink:        #D6E6E2;
    --muted:      #6B8582;

    --vfd-glass:  #0A0E0D;
    --vfd-glass2: #121A18;
    --vfd-cyan:   #5FF5D0;
    --vfd-amber:  #FFB53C;
    --vfd-dim:    #2E4A44;

    --radius: 14px;

    /* height of the two main panels — the number to nudge if the doc
       page doesn't quite fit. */
    --panel-h: 1040px;

    /* Google iframes can't be styled from here; this force-darkens them.
       Set to none for stock white embeds. */
    --embed-filter: invert(0.92) hue-rotate(180deg) saturate(0.85) contrast(0.95);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }

  body {
    font-family: 'Montserrat', system-ui, sans-serif;
    background: var(--ground);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ============================================================
     VFD MASTHEAD
     ============================================================ */
  .masthead {
    position: sticky;
    top: 0;
    z-index: 50;
    background: radial-gradient(120% 140% at 50% 0%, var(--vfd-glass2) 0%, var(--vfd-glass) 70%);
    border-bottom: 1px solid #000;
    box-shadow: 0 2px 22px rgba(0,0,0,.6);
    padding: 18px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 26px;
    flex-wrap: wrap;
  }

  .scanlines {
    position: absolute; inset: 0; overflow: hidden; pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,.035) 0px, rgba(255,255,255,.035) 1px,
      transparent 1px, transparent 3px);
    mix-blend-mode: screen;
  }

  .display { position: relative; z-index: 1; min-width: 0; }
  .vfd-date {
    font-family: 'Share Tech Mono', ui-monospace, monospace;
    font-size: clamp(26px, 4.4vw, 54px);
    line-height: 1.25; padding-bottom: 2px;
    letter-spacing: 3px; text-transform: uppercase;
    color: var(--vfd-cyan); white-space: nowrap;
    text-shadow: 0 0 4px rgba(95,245,208,.9), 0 0 14px rgba(95,245,208,.55), 0 0 34px rgba(95,245,208,.28);
  }
  .vfd-date .sep { color: var(--vfd-amber); margin: 0 6px; text-shadow: 0 0 4px rgba(255,181,60,.9), 0 0 16px rgba(255,181,60,.5); }
  .vfd-date .yr { color: var(--vfd-dim); text-shadow: none; }
  .vfd-sub {
    margin-top: 6px; font-family: 'Share Tech Mono', ui-monospace, monospace;
    font-size: 14px; letter-spacing: 4px; text-transform: uppercase;
    color: var(--vfd-amber); text-shadow: 0 0 6px rgba(255,181,60,.55), 0 0 18px rgba(255,181,60,.25);
  }

  .links { position: relative; z-index: 1; display: flex; gap: 10px; flex-wrap: wrap; }
  .link {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 15px; border-radius: 8px;
    background: rgba(95,245,208,.05); border: 1px solid rgba(95,245,208,.28);
    color: var(--vfd-cyan); text-decoration: none;
    font-family: 'Share Tech Mono', ui-monospace, monospace;
    font-size: 14px; letter-spacing: 2px; text-transform: uppercase;
    text-shadow: 0 0 6px rgba(95,245,208,.5);
    transition: background .15s ease, border-color .15s ease, color .15s ease, transform .15s ease, box-shadow .15s ease;
  }
  .link:hover {
    background: rgba(255,181,60,.12); border-color: var(--vfd-amber); color: var(--vfd-amber);
    text-shadow: 0 0 8px rgba(255,181,60,.8); box-shadow: 0 0 16px rgba(255,181,60,.22); transform: translateY(-1px);
  }
  .link:focus-visible { outline: 2px solid var(--vfd-amber); outline-offset: 2px; }
  .link .pip { width: 6px; height: 6px; border-radius: 1px; background: currentColor; box-shadow: 0 0 6px currentColor; flex: none; }

  /* ============================================================
     LAYOUT  —  two panels: [ to-do ] [ tabbed doc / calendar ]
     ============================================================ */
  .grid {
    flex: 1;
    display: grid;
    grid-template-columns: 378px minmax(0, 1fr);
    gap: 14px;
    padding: 12px 14px 14px;
    max-width: none;
    width: 100%;
    margin: 0;
    align-items: stretch;
  }

  .panel {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: 0 2px 20px rgba(0,0,0,.5);
    display: flex; flex-direction: column; overflow: hidden; min-width: 0;
    min-height: var(--panel-h);
  }

  .panel-head {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 0 16px;
    background: var(--surface-2);
    border-bottom: 1px solid var(--line);
    min-height: 46px;
  }
  .panel-title {
    font-family: 'Share Tech Mono', ui-monospace, monospace;
    font-size: 15px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--vfd-cyan); text-shadow: 0 0 8px rgba(95,245,208,.35);
  }
  .panel-link {
    font-family: 'Share Tech Mono', ui-monospace, monospace;
    font-size: 12px; letter-spacing: 1px; text-transform: uppercase;
    color: var(--muted); text-decoration: none; white-space: nowrap;
    transition: color .15s ease, text-shadow .15s ease;
  }
  .panel-link:hover { color: var(--vfd-amber); text-shadow: 0 0 8px rgba(255,181,60,.6); }

  /* ============================================================
     TABBED PANEL  (doc  <->  calendar)
     ============================================================ */
  .tabs { display: flex; gap: 2px; height: 100%; }
  .tab {
    font-family: 'Share Tech Mono', ui-monospace, monospace;
    font-size: 14px; letter-spacing: 2px; text-transform: uppercase;
    padding: 0 18px; border: 0; cursor: pointer;
    background: transparent; color: var(--muted);
    border-bottom: 2px solid transparent;
    transition: color .15s ease, border-color .15s ease, text-shadow .15s ease;
  }
  .tab:hover { color: var(--vfd-cyan); }
  .tab.active {
    color: var(--vfd-cyan);
    border-bottom-color: var(--vfd-cyan);
    text-shadow: 0 0 8px rgba(95,245,208,.5);
  }
  .tab:focus-visible { outline: 2px solid var(--vfd-amber); outline-offset: -2px; }

  .tab-body { flex: 1; position: relative; display: flex; }
  .tab-frame { flex: 1; width: 100%; border: 0; background: #fff; filter: var(--embed-filter); }
  .tab-frame[hidden] { display: none; }

  /* ============================================================
     TO-DO
     ============================================================ */
  .todo-add { display: flex; gap: 7px; padding: 13px 14px; border-bottom: 1px solid var(--line); }
  .todo-input {
    flex: 1; min-width: 0; font-family: 'Montserrat', sans-serif; font-size: 15px;
    padding: 11px 12px; border: 1px solid var(--line); border-radius: 9px;
    color: var(--ink); background: #0A1113;
  }
  .todo-input::placeholder { color: #4E6763; }
  .todo-input:focus { outline: none; border-color: var(--vfd-cyan); box-shadow: 0 0 10px rgba(95,245,208,.18); }
  .todo-addbtn {
    flex: none; width: 40px; border: 0; border-radius: 9px; font-size: 21px; line-height: 1; cursor: pointer;
    background: rgba(95,245,208,.12); border: 1px solid rgba(95,245,208,.35);
    color: var(--vfd-cyan); text-shadow: 0 0 8px rgba(95,245,208,.6);
    transition: background .15s ease, box-shadow .15s ease;
  }
  .todo-addbtn:hover { background: rgba(95,245,208,.22); box-shadow: 0 0 14px rgba(95,245,208,.25); }
  .todo-addbtn:focus-visible { outline: 2px solid var(--vfd-amber); outline-offset: 2px; }

  .todo-list { flex: 1; overflow-y: auto; padding: 8px; list-style: none; }
  .todo-item { display: flex; align-items: center; gap: 11px; padding: 12px 9px; border-radius: 9px; transition: background .12s ease; }
  .todo-item:hover { background: rgba(95,245,208,.05); }
  .todo-item:hover .todo-del { opacity: 1; }

  .todo-check {
    flex: none; width: 22px; height: 22px; border: 2px solid var(--line); border-radius: 6px;
    cursor: pointer; display: grid; place-items: center;
    transition: border-color .12s ease, background .12s ease, box-shadow .12s ease;
  }
  .todo-check:hover { border-color: var(--vfd-cyan); }
  .todo-item.done .todo-check { background: rgba(95,245,208,.18); border-color: var(--vfd-cyan); box-shadow: 0 0 10px rgba(95,245,208,.3); }
  .todo-check svg { width: 13px; height: 13px; stroke: var(--vfd-cyan); stroke-width: 3; fill: none; opacity: 0; }
  .todo-item.done .todo-check svg { opacity: 1; }

  .todo-text {
    flex: 1; font-size: 16px; line-height: 1.35; word-break: break-word;
    color: var(--vfd-amber); text-shadow: 0 0 8px rgba(255,181,60,.3);
  }
  .todo-item.done .todo-text {
    color: var(--vfd-cyan); text-shadow: 0 0 8px rgba(95,245,208,.3);
    text-decoration: line-through; text-decoration-color: rgba(95,245,208,.55);
  }

  .todo-del {
    flex: none; border: 0; background: none; color: var(--muted); font-size: 18px; line-height: 1;
    cursor: pointer; opacity: 0; padding: 3px 5px; border-radius: 6px;
    transition: opacity .12s ease, color .12s ease, background .12s ease;
  }
  .todo-del:hover { color: #FF6B5E; background: rgba(255,107,94,.1); }
  .todo-del:focus-visible { opacity: 1; outline: 2px solid var(--vfd-amber); }

  .todo-empty { padding: 40px 20px; text-align: center; color: var(--muted); font-size: 14px; line-height: 1.6; }
  .todo-foot {
    padding: 12px 14px; border-top: 1px solid var(--line); background: var(--surface-2);
    font-family: 'Share Tech Mono', ui-monospace, monospace; font-size: 12px; letter-spacing: 1px; color: var(--muted);
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
  }
  .todo-clear {
    border: 0; background: none; color: var(--muted);
    font-family: 'Share Tech Mono', ui-monospace, monospace; font-size: 12px; letter-spacing: 1px;
    cursor: pointer; text-decoration: underline;
  }
  .todo-clear:hover { color: var(--vfd-amber); }

  /* ============================================================
     RESPONSIVE
     ============================================================ */
  @media (max-width: 900px) {
    :root { --panel-h: 70vh; }
    .grid { grid-template-columns: minmax(0, 1fr); padding: 12px; }
    .masthead { padding: 14px 16px; }
    .vfd-date { letter-spacing: 2px; }
    .tab { padding: 0 12px; font-size: 12px; letter-spacing: 1px; }
  }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

  <!-- ============ VFD MASTHEAD ============ -->
  <header class="masthead">
    <div class="scanlines" aria-hidden="true"></div>
    <div class="display">
      <div class="vfd-date" id="vfdDate">&nbsp;</div>
      <div class="vfd-sub"  id="vfdSub"></div>
    </div>
    <nav class="links" id="links" aria-label="Quick links"></nav>
  </header>

  <!-- ============ GRID ============ -->
  <main class="grid">

    <!-- TO-DO -->
    <aside class="panel todo-panel">
      <div class="panel-head"><span class="panel-title">To-Do</span></div>
      <div class="todo-add">
        <input class="todo-input" id="todoInput" type="text" placeholder="Add a task…" autocomplete="off">
        <button class="todo-addbtn" id="todoAdd" aria-label="Add task">+</button>
      </div>
      <ul class="todo-list" id="todoList"></ul>
      <div class="todo-foot">
        <span id="todoCount">0 OPEN</span>
        <button class="todo-clear" id="todoClear">Clear done</button>
      </div>
    </aside>

    <!-- TABBED : BVA Planning Calendar (doc)  <->  Google Calendar -->
    <section class="panel">
      <div class="panel-head">
        <div class="tabs" role="tablist">
          <button class="tab active" role="tab" data-tab="bva"  id="tabBva">BVA Planning Calendar</button>
          <button class="tab"        role="tab" data-tab="gcal" id="tabGcal">Google Calendar</button>
        </div>
        <a class="panel-link" id="tabExternal" target="_blank" rel="noopener"
           href="https://docs.google.com/document/d/1h-wb4hnfBrN6WwA5_01LOIwjwqNHosFzHEoeYS1Pu7I/edit">Open to edit &rarr;</a>
      </div>
      <div class="tab-body">
        <iframe class="tab-frame" id="paneBva" title="BVA Planning Calendar"
          src="https://docs.google.com/document/d/1h-wb4hnfBrN6WwA5_01LOIwjwqNHosFzHEoeYS1Pu7I/preview"></iframe>
        <iframe class="tab-frame" id="paneGcal" title="Google Calendar" hidden
          src="https://calendar.google.com/calendar/embed?ctz=America%2FChicago&mode=MONTH&showTitle=0&showPrint=0&showCalendars=0&src=khuebner88%40gmail.com&color=%230B5394&src=audraboxy%40gmail.com&color=%23E0A100"></iframe>
      </div>
    </section>

  </main>

<script>
/* ============================================================
   QUICK LINKS
   ============================================================ */
const QUICK_LINKS = [
  { label: "Canvas",  url: "https://canvasdiscover.bluevalleyk12.org/" },
  { label: "Outlook", url: "https://outlook.cloud.microsoft/mail/" },
  { label: "Claude",  url: "https://claude.ai" },
  { label: "Drive",   url: "https://drive.google.com" },
  { label: "Gmail",   url: "https://mail.google.com" },
];
(function () {
  const nav = document.getElementById('links');
  QUICK_LINKS.forEach(function (l) {
    const a = document.createElement('a');
    a.className = 'link'; a.href = l.url; a.target = '_blank'; a.rel = 'noopener';
    a.innerHTML = '<span class="pip"></span>' + l.label;
    nav.appendChild(a);
  });
})();

/* ============================================================
   TABS  —  doc  <->  calendar, with adaptive header link
   ============================================================ */
const EXTERNAL = {
  bva:  { href: 'https://docs.google.com/document/d/1h-wb4hnfBrN6WwA5_01LOIwjwqNHosFzHEoeYS1Pu7I/edit', text: 'Open to edit \u2192' },
  gcal: { href: 'https://calendar.google.com/calendar/u/0/r/month', text: 'Open in Google \u2192' }
};
function switchTab(name) {
  document.querySelectorAll('.tab').forEach(function (b) { b.classList.toggle('active', b.dataset.tab === name); });
  document.getElementById('paneBva').hidden  = (name !== 'bva');
  document.getElementById('paneGcal').hidden = (name !== 'gcal');
  const ext = document.getElementById('tabExternal');
  ext.href = EXTERNAL[name].href;
  ext.textContent = EXTERNAL[name].text;
}
document.querySelectorAll('.tab').forEach(function (b) {
  b.addEventListener('click', function () { switchTab(b.dataset.tab); });
});

/* ============================================================
   VFD DATE DISPLAY
   ============================================================ */
function paintDate() {
  const now = new Date();
  const dow  = now.toLocaleDateString('en-US', { weekday: 'short' });
  const mon  = now.toLocaleDateString('en-US', { month: 'short' });
  const day  = now.getDate();
  const year = now.getFullYear();
  const h    = now.getHours();
  document.getElementById('vfdDate').innerHTML =
    dow + '<span class="sep">/</span>' + mon + ' ' + day +
    '<span class="sep">/</span><span class="yr">' + year + '</span>';
  document.getElementById('vfdSub').textContent =
    h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
}
paintDate();
setInterval(paintDate, 60 * 1000);

/* ============================================================
   TO-DO  —  persists per-browser via localStorage
   ============================================================ */
const KEY = 'dashboard-todos';
let todos = [];
try { todos = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { todos = []; }

const listEl  = document.getElementById('todoList');
const inputEl = document.getElementById('todoInput');
const countEl = document.getElementById('todoCount');

function save()    { try { localStorage.setItem(KEY, JSON.stringify(todos)); } catch (e) {} }
function toggle(i) { todos[i].done = !todos[i].done; save(); render(); }
function remove(i) { todos.splice(i, 1); save(); render(); }
function add(text) { text = text.trim(); if (!text) return; todos.push({ text: text, done: false }); save(); render(); }

function render() {
  listEl.innerHTML = '';
  if (todos.length === 0) {
    listEl.innerHTML = '<li class="todo-empty">Nothing here yet.<br>Add your first task above.</li>';
  } else {
    todos.forEach(function (t, i) {
      const li = document.createElement('li');
      li.className = 'todo-item' + (t.done ? ' done' : '');
      li.innerHTML =
        '<span class="todo-check" role="checkbox" tabindex="0" aria-checked="' + t.done + '">' +
          '<svg viewBox="0 0 16 16"><polyline points="3,8 7,12 13,4"/></svg></span>' +
        '<span class="todo-text"></span>' +
        '<button class="todo-del" aria-label="Delete task">&times;</button>';
      li.querySelector('.todo-text').textContent = t.text;
      li.querySelector('.todo-check').addEventListener('click', function () { toggle(i); });
      li.querySelector('.todo-check').addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(i); }
      });
      li.querySelector('.todo-del').addEventListener('click', function () { remove(i); });
      listEl.appendChild(li);
    });
  }
  const open = todos.filter(function (t) { return !t.done; }).length;
  countEl.textContent = open + ' OPEN';
}

document.getElementById('todoAdd').addEventListener('click', function () { add(inputEl.value); inputEl.value = ''; inputEl.focus(); });
inputEl.addEventListener('keydown', function (e) { if (e.key === 'Enter') { add(inputEl.value); inputEl.value = ''; } });
document.getElementById('todoClear').addEventListener('click', function () { todos = todos.filter(function (t) { return !t.done; }); save(); render(); });

render();
</script>
</body>
</html>
